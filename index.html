<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2c1810">
<title>Aussie Barista Trainer ☕</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #2c1810; color: #f5f0e8;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    text-align: center;
  }
  .loader { padding: 40px; max-width: 420px; }
  .loader h2 { font-size: 1.4rem; margin-bottom: 8px; color: #d4a373; }
  .loader p { color: #b0a090; font-size: 0.95rem; margin-bottom: 18px; }
  .loader a {
    display: inline-block; padding: 12px 24px; background: #d4a373; color: #2c1810;
    border-radius: 8px; text-decoration: none; font-size: 0.95rem; margin: 6px;
    font-weight: bold;
  }
  .loader a.secondary { background: #5a3a22; color: #f5f0e8; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #5a3a22; border-top-color: #d4a373;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main class="loader">
  <div class="spinner"></div>
  <h2>☕ Aussie Barista Trainer</h2>
  <p>기기를 감지하는 중...</p>
  <noscript>
    <p style="color:#f87171;">JavaScript가 필요합니다. 직접 선택해 주세요:</p>
    <a href="barista-pc.html">PC 버전</a>
    <a href="barista-ios.html">iPhone 버전</a>
    <a href="barista-mobile.html">Android 버전</a>
  </noscript>
  <div id="manual" style="display:none;">
    <p>자동 이동이 안 될 경우 직접 선택하세요:</p>
    <a href="barista-pc.html">PC 버전</a>
    <a href="barista-ios.html">iPhone 버전</a>
    <a href="barista-mobile.html">Android 버전</a>
  </div>
</main>
<script>
(function() {
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/i.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isOtherMobile = /webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  var isTouchMobile = (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);
  var isMobile = isIOS || isAndroid || isOtherMobile || isTouchMobile;

  var v = '_v=' + Date.now();
  try {
    if (isIOS) {
      window.location.replace('barista-ios.html?' + v);
    } else if (isMobile) {
      window.location.replace('barista-mobile.html?' + v);
    } else {
      window.location.replace('barista-pc.html?' + v);
    }
  } catch(e) {
    document.getElementById('manual').style.display = 'block';
  }

  setTimeout(function() {
    document.getElementById('manual').style.display = 'block';
  }, 2000);
})();
</script>
</body>
</html>
